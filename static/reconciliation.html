<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>上报对账台</title>
<style>
body{font:15px system-ui;max-width:1200px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#172033}
section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 12px #0001}
input,button{font:inherit;padding:8px;margin:4px}
input{width:220px}
button{background:#174ea6;color:white;border:0;border-radius:6px;cursor:pointer}
button.gray{background:#6b7280}
button.danger{background:#b91c1c}
button.warn{background:#b45309}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
th{background:#f3f4f6}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;color:white}
.badge.not_submitted{background:#6b7280}.badge.reconciling{background:#2563eb}
.badge.accepted{background:#16a34a}.badge.rejected{background:#b45309}
.badge.failed{background:#dc2626}.badge.invalid{background:#7c3aed}.badge.closed{background:#374151}
.mono{font-family:ui-monospace,monospace;font-size:12px;color:#4b5563;word-break:break-all}
.stale{color:#b91c1c;font-weight:600}
.ok{color:#16a34a;font-weight:600}
a{color:#174ea6}
</style>
<h1>上报对账台</h1>
<p>每次按案例修订生成<strong>不可变报文</strong>；网络超时重试沿用<strong>同一幂等键</strong>，不会重复受理；
回执只受理与<strong>当前报文版本一致</strong>的结果；案例变化后未决上报立即失效并转人工复核。</p>
<section>
  <label>用户 <input id="user" value="global-admin"></label>
  <label>角色 <input id="role" value="global_admin"></label>
  <label>区域 <input id="region" value="" placeholder="区域负责人必填，如 CN"></label>
  <button onclick="load()">刷新对账</button>
  <a href="/" style="margin-left:12px">返回案例台</a>
</section>
<section id="table-wrap"><p>加载中…</p></section>
<script src="/static/reconciliation.js"></script>
